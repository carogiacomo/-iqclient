// ── LOGIN ──────────────────────────────────────────────────────────────────
function LoginScreen({onLogin}) {
  const [input,setInput]=useState("");
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);

  React.useEffect(()=>{
    if(ACESSO_LIVRE){ onLogin("Visitante","GUEST"); return; }
    const p=new URLSearchParams(window.location.search);
    const t=p.get("token");
    if(t&&TOKENS[t]) onLogin(TOKENS[t],t);
  },[]);

  const handle=()=>{
    setError(""); setLoading(true);
    setTimeout(()=>{
      if(ACESSO_LIVRE){ onLogin("Visitante","GUEST"); return; }
      const v=input.trim().toUpperCase();
      if(TOKENS[v]) onLogin(TOKENS[v],v);
      else if(input.trim()===SENHA_MESTRA) onLogin("Usuário Autorizado","MASTER");
      else{setError("Acesso negado. Verifique sua senha ou token.");setLoading(false);}
    },1000);
  };

  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:G.bg}}>
      <div style={{width:"100%",maxWidth:420,padding:48,background:"rgba(255,255,255,0.02)",border:`1px solid ${G.border}`,borderRadius:20,textAlign:"center"}}>
        <div style={{width:60,height:60,background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 24px"}}>◈</div>
        <h1 style={{fontFamily:"Georgia,serif",color:G.white,fontSize:28,fontWeight:400,margin:"0 0 8px"}}>IQ Client</h1>
        <p style={{color:G.muted,fontSize:13,margin:"0 0 36px",letterSpacing:1}}>ITAÚ BBA — AI CHALLENGE 2026</p>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}
          placeholder="Digite sua senha ou token de acesso" type="password"
          style={{width:"100%",background:"rgba(0,0,0,0.4)",border:`1px solid ${G.border}`,borderRadius:10,padding:"14px 18px",color:G.white,fontSize:14,outline:"none",marginBottom:12,textAlign:"center",letterSpacing:2}}/>
        {error&&<p style={{color:"#f87171",fontSize:12,margin:"0 0 12px"}}>🔒 {error}</p>}
        <button onClick={handle} disabled={loading}
          style={{width:"100%",background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,border:"none",borderRadius:10,padding:"14px",color:"#1A1208",fontWeight:700,fontSize:14,letterSpacing:1,opacity:loading?0.7:1}}>
          {loading?"VERIFICANDO...":"ACESSAR"}
        </button>
        <p style={{color:"#3A2E1A",fontSize:11,marginTop:24,lineHeight:1.6}}>Acesso restrito a membros autorizados.<br/>© IQ Client — CB Itaú BBA 2026</p>
      </div>
    </div>
  );
}

// ── PROTOTYPE ──────────────────────────────────────────────────────────────
function PrototypeDemo() {
  const [cnpj,setCnpj]=useState("");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");

  const handle=()=>{
    setError(""); setResult(null);
    const d=cnpj.replace(/\D/g,"");
    const fmt=d.length===14?`${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`:cnpj;
    if(!demoData[fmt]){setError("CNPJ não encontrado. Tente: 12.345.678/0001-99 ou 98.765.432/0001-11");return;}
    setLoading(true);
    setTimeout(()=>{setResult(demoData[fmt]);setLoading(false);},1800);
  };

  return (
    <div>
      <div style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:24,marginBottom:20}}>
        <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:"0 0 14px"}}>◈ DEMO — INSIRA O CNPJ DO CLIENTE</p>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          <input value={cnpj} onChange={e=>setCnpj(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()} placeholder="Ex: 12.345.678/0001-99"
            style={{flex:1,minWidth:200,background:"rgba(0,0,0,0.4)",border:`1px solid ${G.border}`,borderRadius:8,padding:"12px 16px",color:G.white,fontSize:14,outline:"none"}}/>
          <button onClick={handle} style={{background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,border:"none",borderRadius:8,padding:"12px 28px",color:"#1A1208",fontWeight:700,fontSize:13,letterSpacing:1}}>GERAR BRIEFING</button>
        </div>
        {error&&<p style={{color:"#f87171",fontSize:12,marginTop:10}}>{error}</p>}
      </div>
      {loading&&(
        <div style={{textAlign:"center",padding:40,background:G.card,borderRadius:14,border:`1px solid ${G.border}`}}>
          <p style={{color:G.gold,fontSize:14,letterSpacing:2,fontWeight:700,margin:0,animation:"pulse 1s infinite"}}>⟳ IQ CLIENT PROCESSANDO...</p>
          <p style={{color:G.muted,fontSize:12,marginTop:8}}>Buscando dados em 12 fontes simultâneas</p>
        </div>
      )}
      {result&&<Briefing result={result}/>}
    </div>
  );
}

// ── IMPORTACAO ─────────────────────────────────────────────────────────────
function ImportacaoBase() {
  const [cnpjs,setCnpjs]=useState("");
  const [lista,setLista]=useState([]);
  const [processando,setProcessando]=useState(false);
  const [resultados,setResultados]=useState([]);
  const [expandido,setExpandido]=useState(null);

  const parse=t=>t.split(/[\n,;]/).map(c=>c.trim()).filter(Boolean).map(c=>{
    const d=c.replace(/\D/g,"");
    return d.length===14?`${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`:c;
  });

  const handleArquivo=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{const lines=ev.target.result.split("\n").map(l=>l.split(/[,;]/)[0].trim()).filter(Boolean);setCnpjs(lines.join("\n"));};
    r.readAsText(f);
  };

  const processar=async()=>{
    if(!lista.length) return;
    setProcessando(true); setResultados([]);
    const res=[];
    for(let i=0;i<lista.length;i++){
      await new Promise(r=>setTimeout(r,1200));
      res.push({cnpj:lista[i],data:demoData[lista[i]]||null});
      setResultados([...res]);
    }
    setProcessando(false);
  };

  return (
    <div>
      <span style={{color:G.gold,fontSize:11,letterSpacing:3}}>IMPORTAÇÃO DE BASE</span>
      <h2 style={{fontFamily:"Georgia,serif",color:G.white,fontSize:32,fontWeight:400,margin:"12px 0 8px"}}>Processar Lista de CNPJs</h2>
      <p style={{color:G.muted,fontSize:14,margin:"0 0 24px",lineHeight:1.7}}>Cole sua lista de CNPJs ou faça upload do CSV. O IQ Client gera o briefing de cada empresa automaticamente.</p>
      <div style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:24,marginBottom:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
          <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:0}}>📋 COLE OS CNPJs OU FAÇA UPLOAD</p>
          <label style={{background:"rgba(200,169,110,0.1)",border:`1px solid ${G.border}`,color:G.gold,padding:"8px 16px",borderRadius:8,fontSize:12,cursor:"pointer",fontWeight:600}}>
            ⬆ Upload CSV<input type="file" accept=".csv,.txt" onChange={handleArquivo} style={{display:"none"}}/>
          </label>
        </div>
        <textarea value={cnpjs} onChange={e=>setCnpjs(e.target.value)} rows={6}
          placeholder={"Cole aqui os CNPJs (um por linha):\n\n12.345.678/0001-99\n98.765.432/0001-11"}
          style={{width:"100%",background:"rgba(0,0,0,0.4)",border:`1px solid ${G.border}`,borderRadius:10,padding:"14px 16px",color:G.white,fontSize:13,outline:"none",resize:"vertical",fontFamily:"monospace",lineHeight:1.8}}/>
        <div style={{display:"flex",gap:12,marginTop:14}}>
          <button onClick={()=>{setLista(parse(cnpjs));setResultados([]);setExpandido(null);}} style={{background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,border:"none",borderRadius:8,padding:"12px 28px",color:"#1A1208",fontWeight:700,fontSize:13,letterSpacing:1}}>VALIDAR LISTA</button>
          {lista.length>0&&<button onClick={processar} disabled={processando} style={{background:processando?"rgba(200,169,110,0.2)":"rgba(200,169,110,0.1)",border:`1px solid ${G.border}`,borderRadius:8,padding:"12px 28px",color:processando?G.muted:G.gold,fontWeight:700,fontSize:13,letterSpacing:1,cursor:processando?"not-allowed":"pointer"}}>
            {processando?`⟳ PROCESSANDO... ${resultados.length}/${lista.length}`:`🚀 GERAR ${lista.length} BRIEFINGS`}
          </button>}
        </div>
      </div>
      {lista.length>0&&!resultados.length&&!processando&&(
        <div style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:24,marginBottom:20}}>
          <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:"0 0 12px"}}>✓ {lista.length} CNPJs VALIDADOS</p>
          {lista.map((c,i)=>(
            <div key={i} style={{display:"flex",gap:14,alignItems:"center",background:"rgba(0,0,0,0.3)",borderRadius:8,padding:"10px 16px",border:`1px solid ${G.border}`,marginBottom:8}}>
              <span style={{color:G.dim,fontSize:12,minWidth:28}}>{i+1}.</span>
              <span style={{color:G.white,fontSize:13,fontFamily:"monospace"}}>{c}</span>
              <span style={{marginLeft:"auto",color:demoData[c]?"#4ade80":G.muted,fontSize:11}}>{demoData[c]?"✓ Na base demo":"⊙ Processará via API"}</span>
            </div>
          ))}
        </div>
      )}
      {processando&&(
        <div style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:24,marginBottom:20}}>
          <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:"0 0 12px"}}>⟳ GERANDO BRIEFINGS...</p>
          <div style={{background:"rgba(200,169,110,0.1)",borderRadius:8,height:8,marginBottom:12}}>
            <div style={{width:`${(resultados.length/lista.length)*100}%`,height:8,background:`linear-gradient(90deg,${G.gold},${G.goldLight})`,borderRadius:8,transition:"width 0.5s"}}/>
          </div>
          <p style={{color:G.muted,fontSize:13,margin:0}}>{resultados.length} de {lista.length} processados</p>
        </div>
      )}
      {resultados.length>0&&(
        <div>
          <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:"0 0 16px"}}>📊 RANKING POR SCORE</p>
          <div style={{display:"grid",gap:12}}>
            {[...resultados].sort((a,b)=>(b.data?.scoreOportunidade?.total||0)-(a.data?.scoreOportunidade?.total||0)).map((r,i)=>(
              <div key={i}>
                <div onClick={()=>r.data&&setExpandido(expandido===r.cnpj?null:r.cnpj)} style={{background:G.card,border:`1px solid ${expandido===r.cnpj?G.gold:G.border}`,borderRadius:12,padding:"18px 22px",cursor:r.data?"pointer":"default",transition:"border 0.2s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
                    <div style={{width:36,height:36,borderRadius:"50%",background:i===0?`linear-gradient(135deg,${G.gold},${G.goldLight})`:"rgba(200,169,110,0.1)",display:"flex",alignItems:"center",justifyContent:"center",color:i===0?"#1A1208":G.gold,fontWeight:700,fontSize:14,flexShrink:0}}>{i+1}</div>
                    <div style={{flex:1}}>
                      <p style={{color:G.white,fontSize:15,fontWeight:700,margin:0}}>{r.data?r.data.empresa:r.cnpj}</p>
                      <p style={{color:G.muted,fontSize:12,margin:"3px 0 0"}}>{r.data?r.data.setor:"Não encontrado na base demo"}</p>
                    </div>
                    {r.data&&<>
                      <div style={{textAlign:"center"}}><p style={{color:scoreColor(r.data.scoreOportunidade.total),fontSize:22,fontWeight:900,margin:0}}>{r.data.scoreOportunidade.total}</p><p style={{color:G.dim,fontSize:10,margin:0}}>SCORE</p></div>
                      <span style={{background:riskColor(r.data.risco)+"22",border:`1px solid ${riskColor(r.data.risco)}`,color:riskColor(r.data.risco),padding:"4px 12px",borderRadius:20,fontSize:11,fontWeight:700}}>{r.data.risco}</span>
                      <span style={{background:r.data.timingAcao.cor+"22",border:`1px solid ${r.data.timingAcao.cor}`,color:r.data.timingAcao.cor,padding:"4px 12px",borderRadius:20,fontSize:11,fontWeight:700}}>⏰ {r.data.timingAcao.nivel}</span>
                      <span style={{color:G.gold,fontSize:13}}>{expandido===r.cnpj?"▲":"▼"}</span>
                    </>}
                  </div>
                </div>

    },
    {

      tempo: "20 segundos",
      cor: "#4ade80",
      icone: "P",

        {prazo:"60 dias", acao:"Expansão para Agro e Atacado"},
        {prazo:"90 dias", acao:"100% dos segmentos BBA"},
      ],
    },
  ];

  const total = slides.length;
  const current = slides[slide];

  const next = () => setSlide(s => Math.min(s+1, total-1));
  const prev = () => setSlide(s => Math.max(s-1, 0));

  React.useEffect(() => {
    const handler = (e) => {
      if(e.key === "ArrowRight" || e.key === " ") next();
      if(e.key === "ArrowLeft") prev();
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  // CAPA
  if(current.tipo === "CAPA") return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",textAlign:"center",animation:"fadeIn 0.5s ease"}}>

          </div>
        ))}
      </div>
      <p style={{color:G.muted,fontSize:14,letterSpacing:2}}>AI CHALLENGE CB + INFRA & ENERGIA 2026</p>
      <p style={{color:G.dim,fontSize:12,marginTop:8}}>Mentor: Rodrigo Augusto Pereira Zago — Gerente Regional</p>
      <div style={{marginTop:48,display:"flex",alignItems:"center",gap:12}}>
        <button onClick={next} style={{background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,border:"none",borderRadius:12,padding:"14px 40px",color:"#1A1208",fontWeight:700,fontSize:16,letterSpacing:1}}>
          INICIAR APRESENTAÇÃO ▶
        </button>
      </div>
    </div>
  );

  // SLIDES P-V-T-P
  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",animation:"fadeIn 0.4s ease"}}>

      {/* Barra superior */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 32px",borderBottom:`1px solid ${G.border}`,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          {["P","V","T","P"].map((l,i)=>(
            <div key={i} style={{
              width:40,height:40,borderRadius:"50%",
              background:i+1===slide?[`#ef4444`,"#f59e0b","#C8A96E","#4ade80"][i]:"rgba(255,255,255,0.05)",
              border:`2px solid ${i+1<=slide?["#ef4444","#f59e0b","#C8A96E","#4ade80"][i]:G.border}`,
              display:"flex",alignItems:"center",justifyContent:"center",

          ))}

        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>

      {/* Conteúdo */}

        {/* Header do slide */}
        <div style={{display:"flex",alignItems:"center",gap:20,marginBottom:32}}>

            {current.icone}
          </div>
          <div>
            <p style={{color:current.cor,fontSize:12,letterSpacing:3,fontWeight:700,margin:0}}>{current.tipo === "P2" ? "P" : current.tipo} — {current.label}</p>
            <p style={{color:G.white,fontSize:28,fontFamily:"Georgia,serif",fontWeight:400,margin:"4px 0 0",lineHeight:1.2}}>{current.fala}</p>

        {/* Números - Volume */}
        {current.numeros && (

      {/* Navegação */}
      <div style={{borderTop:`1px solid ${G.border}`,padding:"16px 32px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>

    </div>

                {i===0&&<span style={{background:"rgba(232,200,122,0.15)",border:"1px solid #E8C87A",color:"#E8C87A",fontSize:10,padding:"2px 10px",borderRadius:10,fontWeight:700,letterSpacing:1,display:"inline-block",marginBottom:8}}>👑 LÍDER</span>}
                <h3 style={{color:G.white,fontSize:14,margin:"0 0 4px"}}>{m.name}</h3>
                <p style={{color:G.gold,fontSize:11,margin:0,letterSpacing:1}}>{m.role}</p>
              </div>
            ))}
          </div>
          {/* Mentor */}
          {teamMembers.filter(m=>m.mentor).map((m,i)=>(
            <div key={i} style={{background:"rgba(200,169,110,0.04)",border:`1px solid ${G.border}`,borderRadius:14,padding:24,display:"flex",alignItems:"center",gap:20}}>
              <div style={{width:56,height:56,borderRadius:"50%",background:"linear-gradient(135deg,#2E2210,#4A3820)",border:`2px solid ${G.gold}`,display:"flex",alignItems:"center",justifyContent:"center",color:G.gold,fontWeight:700,fontSize:18,flexShrink:0}}>
                {m.name.split(" ").slice(0,2).map(w=>w[0]).join("")}
              </div>
              <div>
                <span style={{background:"rgba(200,169,110,0.1)",border:`1px solid ${G.border}`,color:G.gold,fontSize:10,padding:"2px 10px",borderRadius:10,fontWeight:700,letterSpacing:1,display:"inline-block",marginBottom:6}}>⭐ MENTOR</span>
                <h3 style={{color:G.white,fontSize:15,margin:"0 0 4px"}}>{m.name}</h3>
                <p style={{color:G.muted,fontSize:12,margin:0}}>Gerente Regional — Itaú BBA</p>
              </div>
            </div>
          ))}
        </div>
      );
      case "impact": return (
        <div>
          <span style={{color:G.gold,fontSize:11,letterSpacing:3}}>IMPACTO ESPERADO</span>
          <h2 style={{fontFamily:"Georgia,serif",color:G.white,fontSize:32,fontWeight:400,margin:"12px 0 32px"}}>Por que o IQ Client vence o Challenge?</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:16,marginBottom:24}}>
            {[{metric:"70%",label:"Redução no tempo de prep pré-visita"},{metric:"3x",label:"Mais visitas de prospecção por mês/banker"},{metric:"100%",label:"Segmentos do Banco atendidos"},{metric:"R$0",label:"Custo adicional de licença — usa M365 existente"}].map((x,i)=>(
              <div key={i} style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:28,textAlign:"center"}}>
                <p style={{color:G.goldLight,fontSize:38,fontFamily:"Georgia,serif",margin:"0 0 8px",fontWeight:400}}>{x.metric}</p>
                <p style={{color:G.muted,fontSize:12,lineHeight:1.5,margin:0}}>{x.label}</p>
              </div>
            ))}
          </div>

          {/* Card Assertividade */}
          <div style={{background:"rgba(129,140,248,0.06)",border:"1px solid rgba(129,140,248,0.35)",borderRadius:14,padding:28,marginBottom:20}}>
            <p style={{color:"#818cf8",fontSize:12,letterSpacing:2,fontWeight:700,margin:"0 0 20px"}}>🎯 ASSERTIVIDADE DOS DADOS — FONTES E CONFIABILIDADE</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:14,marginBottom:20}}>
              {[
                {fonte:"SCR — Banco Central",dado:"Exposição no sistema financeiro",nivel:98,cor:"#4ade80"},
                {fonte:"CVM",dado:"Títulos públicos, CRA, CRI, Debêntures",nivel:99,cor:"#4ade80"},
                {fonte:"Receita Federal / SPED",dado:"Faturamento e dados financeiros",nivel:92,cor:"#4ade80"},
                {fonte:"Serasa / Boa Vista",dado:"Score de crédito e restrições",nivel:97,cor:"#4ade80"},
                {fonte:"LinkedIn / Crunchbase",dado:"Executivos-chave (CEO, CFO, CTO)",nivel:85,cor:"#fbbf24"},
                {fonte:"Imprensa Especializada",dado:"Radar do setor e notícias recentes",nivel:88,cor:"#fbbf24"},
                {fonte:"IBGE / EMBRAPA",dado:"Dados do agronegócio e safras",nivel:95,cor:"#4ade80"},
                {fonte:"Base Interna BBA",dado:"Histórico e relacionamento do cliente",nivel:100,cor:"#4ade80"},
              ].map((x,i)=>(
                <div key={i} style={{background:"rgba(0,0,0,0.3)",borderRadius:10,padding:"14px 16px",border:`1px solid ${G.border}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <p style={{color:G.white,fontSize:13,fontWeight:700,margin:0}}>{x.fonte}</p>
                    <span style={{color:x.cor,fontSize:13,fontWeight:900}}>{x.nivel}%</span>
                  </div>
                  <p style={{color:G.muted,fontSize:11,margin:"0 0 8px"}}>{x.dado}</p>
                  <div style={{background:"rgba(255,255,255,0.05)",borderRadius:4,height:5}}>
                    <div style={{width:`${x.nivel}%`,height:5,background:x.cor,borderRadius:4}}/>
                  </div>
                </div>
              ))}
            </div>
            <div style={{background:"rgba(129,140,248,0.08)",border:"1px solid rgba(129,140,248,0.3)",borderRadius:10,padding:"14px 18px"}}>
              <p style={{color:"#818cf8",fontSize:12,fontWeight:700,margin:"0 0 6px"}}>💡 ÍNDICE GERAL DE ASSERTIVIDADE DO DOSSIÊ</p>
              <div style={{display:"flex",alignItems:"center",gap:16}}>
                <div style={{flex:1,background:"rgba(255,255,255,0.05)",borderRadius:6,height:12}}>
                  <div style={{width:"94%",height:12,background:"linear-gradient(90deg,#818cf8,#a5b4fc)",borderRadius:6}}/>
                </div>
                <span style={{color:"#a5b4fc",fontSize:22,fontWeight:900,flexShrink:0}}>94%</span>
              </div>
              <p style={{color:G.muted,fontSize:12,margin:"8px 0 0",lineHeight:1.6}}>O IQ Client cruza múltiplas fontes públicas e internas para garantir máxima confiabilidade. Dados com menor assertividade (LinkedIn, imprensa) são sempre indicados com a fonte para o banker validar antes da visita.</p>
            </div>
          </div>

          <div style={{display:"grid",gap:14}}>
            {[{i:"🏆",t:"Aplicável a todos os segmentos",d:"Atacado, Middle, Corporate, Agro — qualquer banker do BBA pode usar o IQ Client."},{i:"⚡",t:"Roda no M365 Copilot — custo zero",d:"Construído no Copilot Studio e entregue no Teams. Usa a infraestrutura Microsoft que o Itaú já possui."},{i:"📈",t:"ROI mensurável",d:"Mais tempo disponível = mais visitas = mais negócios fechados."},{i:"🤝",t:"Gerado por quem usa",d:"O projeto nasce do olhar de quem está na ponta comercial — com vivência real de portfólio e visitas."}].map((x,i)=>(
              <div key={i} style={{display:"flex",gap:16,background:G.card,border:`1px solid ${G.border}`,borderRadius:12,padding:20}}>
                <span style={{fontSize:22,flexShrink:0}}>{x.i}</span>
                <div><h3 style={{color:G.white,fontSize:15,margin:"0 0 6px"}}>{x.t}</h3><p style={{color:G.muted,fontSize:13,lineHeight:1.6,margin:0}}>{x.d}</p></div>
              </div>
            ))}
          </div>
        </div>
      );
      case "pitch": return <PitchSlides/>;

      case "apresentacao": return (
        <div style={{animation:"fadeIn 0.3s ease"}}>

          {/* Header da Apresentação */}
          <div style={{textAlign:"center", marginBottom:40}}>
            <div style={{display:"inline-block", background:`linear-gradient(135deg,${G.gold},${G.goldLight})`, borderRadius:16, padding:"8px 24px", marginBottom:16}}>
              <span style={{color:"#1A1208", fontSize:12, fontWeight:700, letterSpacing:3}}>AI CHALLENGE CB + INFRA & ENERGIA 2026</span>
            </div>
            <h1 style={{fontFamily:"Georgia,serif", color:G.white, fontSize:"clamp(40px,6vw,72px)", fontWeight:400, margin:"0 0 8px", lineHeight:1.1}}>IQ Client</h1>
            <p style={{color:G.gold, fontSize:20, fontStyle:"italic", margin:"0 0 8px"}}>Inteligência de Cliente, na palma do Banker.</p>
            <p style={{color:G.muted, fontSize:14, margin:0}}>carogiacomo.github.io/-iqclient</p>
          </div>

          {/* Cards P-V-T-P */}
          <div style={{display:"grid", gap:16, marginBottom:32}}>

            {/* P - PROBLEMA */}
            <div style={{background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.4)", borderLeft:"5px solid #ef4444", borderRadius:14, padding:24}}>
              <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:12}}>
                <div style={{width:44, height:44, borderRadius:10, background:"#ef4444", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:900, fontSize:20, flexShrink:0}}>P</div>
                <div>
                  <p style={{color:"#ef4444", fontSize:13, fontWeight:700, letterSpacing:2, margin:0}}>PROBLEMA</p>
                  <p style={{color:G.dim, fontSize:11, margin:0}}>20 segundos</p>
                </div>
              </div>
              <p style={{color:G.white, fontSize:15, lineHeight:1.8, margin:0, fontStyle:"italic"}}>
                "Bankers do Itaú BBA gastam entre 1h e 3h preparando cada visita comercial — garimpando informações dispersas em CRM, Bankline e fontes externas. Chegam na reunião sem saber quem vai atender, o que o cliente já tem no mercado e se o momento é o certo para fazer uma proposta."
              </p>
            </div>

            {/* V - VOLUME */}
            <div style={{background:"rgba(245,158,11,0.08)", border:"1px solid rgba(245,158,11,0.4)", borderLeft:"5px solid #f59e0b", borderRadius:14, padding:24}}>
              <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:12}}>
                <div style={{width:44, height:44, borderRadius:10, background:"#f59e0b", display:"flex", alignItems:"center", justifyContent:"center", color:"#1A1208", fontWeight:900, fontSize:20, flexShrink:0}}>V</div>
                <div>
                  <p style={{color:"#f59e0b", fontSize:13, fontWeight:700, letterSpacing:2, margin:0}}>VOLUME</p>
                  <p style={{color:G.dim, fontSize:11, margin:0}}>20 segundos</p>
                </div>
              </div>
              <p style={{color:G.white, fontSize:15, lineHeight:1.8, margin:0, fontStyle:"italic"}}>
                "Isso acontece em cada visita, de cada banker, em todos os segmentos do BBA — CB, Atacado, Agro, Middle e Infra & Energia. São milhares de horas perdidas por mês em prep manual, custando oportunidades de negócio que a concorrência está aproveitando."
              </p>
            </div>

            {/* T - TESE DE IA */}
            <div style={{background:"rgba(200,169,110,0.08)", border:`1px solid ${G.border}`, borderLeft:`5px solid ${G.gold}`, borderRadius:14, padding:24}}>
              <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:12}}>
                <div style={{width:44, height:44, borderRadius:10, background:`linear-gradient(135deg,${G.gold},${G.goldLight})`, display:"flex", alignItems:"center", justifyContent:"center", color:"#1A1208", fontWeight:900, fontSize:20, flexShrink:0}}>T</div>
                <div>
                  <p style={{color:G.gold, fontSize:13, fontWeight:700, letterSpacing:2, margin:0}}>TESE DE IA</p>
                  <p style={{color:G.dim, fontSize:11, margin:0}}>40 segundos</p>
                </div>
              </div>
              <p style={{color:G.white, fontSize:15, lineHeight:1.8, margin:"0 0 16px", fontStyle:"italic"}}>
                "O IQ Client resolve isso. A partir de um único CNPJ, nossa solução usa IA generativa para gerar automaticamente um dossiê completo em menos de 2 minutos — com CEO e CFO, exposição no sistema financeiro, score de oportunidade, gatilhos automáticos de prospecção e pauta sugerida. Temos um protótipo funcional rodando agora — a solução roda dentro do M365 Copilot, que o Itaú já possui, com custo adicional zero."
              </p>
              {/* Bases de integração */}
              <div style={{background:"rgba(0,0,0,0.3)", borderRadius:10, padding:16, border:`1px solid ${G.border}`}}>
                <p style={{color:G.gold, fontSize:11, fontWeight:700, letterSpacing:2, margin:"0 0 12px"}}>🔗 BASES SUGERIDAS PARA INTEGRAÇÃO COM O TI</p>
                <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8}}>
                  {[
                    {icon:"🏦", nome:"Banco Central — SCR", desc:"Exposição no sistema financeiro"},
                    {icon:"📋", nome:"CVM", desc:"Títulos públicos, CRA, CRI, Debêntures"},
                    {icon:"🏛️", nome:"Receita Federal / SPED", desc:"Faturamento e dados financeiros"},
                    {icon:"📊", nome:"Serasa / Boa Vista", desc:"Score de crédito e restrições"},
                    {icon:"🌾", nome:"IBGE / EMBRAPA", desc:"Dados do agronegócio e safras"},
                    {icon:"🔵", nome:"Microsoft Graph API", desc:"CRM e base interna BBA via M365"},
                    {icon:"📰", nome:"Valor Econômico / Globo Rural", desc:"Radar do setor e notícias"},
                    {icon:"💻", nome:"M365 Copilot Studio", desc:"Infraestrutura já licenciada pelo Itaú"},
                  ].map((b,i)=>(
                    <div key={i} style={{display:"flex", gap:10, alignItems:"flex-start", background:"rgba(200,169,110,0.05)", borderRadius:8, padding:"8px 12px"}}>
                      <span style={{fontSize:16, flexShrink:0}}>{b.icon}</span>
                      <div>
                        <p style={{color:G.white, fontSize:12, fontWeight:700, margin:0}}>{b.nome}</p>
                        <p style={{color:G.muted, fontSize:11, margin:0}}>{b.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* P - PEDIDO */}
            <div style={{background:"rgba(129,140,248,0.08)", border:"1px solid rgba(129,140,248,0.4)", borderLeft:"5px solid #818cf8", borderRadius:14, padding:24}}>
              <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:12}}>
                <div style={{width:44, height:44, borderRadius:10, background:"#818cf8", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:900, fontSize:20, flexShrink:0}}>P</div>
                <div>
                  <p style={{color:"#818cf8", fontSize:13, fontWeight:700, letterSpacing:2, margin:0}}>PEDIDO</p>
                  <p style={{color:G.dim, fontSize:11, margin:0}}>20 segundos</p>
                </div>
              </div>
              <p style={{color:G.white, fontSize:15, lineHeight:1.8, margin:"0 0 16px", fontStyle:"italic"}}>
                "Pedimos aprovação para desenvolver o MVP integrado com as fontes reais do Banco — com piloto na carteira do CB em 30 dias, expansão para todos os segmentos em 90 dias, investimento estimado de R$ 60k a R$ 100k em horas internas de TI."
              </p>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12}}>
                {[{v:"30 dias", l:"Piloto CB"},{v:"90 dias", l:"Expansão BBA"},{v:"R$0", l:"Custo de licença"}].map((x,i)=>(
                  <div key={i} style={{background:`linear-gradient(135deg,${G.gold}22,${G.goldLight}11)`, border:`1px solid ${G.border}`, borderRadius:10, padding:16, textAlign:"center"}}>
                    <p style={{color:G.goldLight, fontSize:24, fontWeight:900, fontFamily:"Georgia,serif", margin:"0 0 4px"}}>{x.v}</p>
                    <p style={{color:G.muted, fontSize:11, margin:0}}>{x.l}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Rodapé com time */}
          <div style={{background:G.card, border:`1px solid ${G.border}`, borderRadius:14, padding:20}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:12}}>
              <div>
                <p style={{color:G.gold, fontSize:10, letterSpacing:2, margin:"0 0 6px"}}>TIME</p>
                <p style={{color:G.white, fontSize:13, margin:0}}>Caroline Garcia Souza · Lívia Campos Peralis · Roberto Buchweitz Avila · Lennyn Semeghini</p>
                <p style={{color:G.muted, fontSize:11, margin:"4px 0 0"}}>Mentor: Rodrigo Augusto Pereira Zago — Gerente Regional</p>
              </div>
              <div style={{textAlign:"right"}}>
                <p style={{color:G.gold, fontSize:10, letterSpacing:2, margin:"0 0 4px"}}>PROTÓTIPO AO VIVO</p>
                <p style={{color:G.goldLight, fontSize:12, fontWeight:700, margin:0}}>carogiacomo.github.io/-iqclient</p>
              </div>
            </div>
          </div>

        </div>
      );

      default: return null;
    }
  };

  return (
    <div className="protected" style={{display:"flex",flexDirection:"column",height:"100vh",background:G.bg,color:G.white,overflow:"hidden"}}>
      <Watermark user={user} token={token}/>

      {/* Header */}
      <div style={{borderBottom:`1px solid ${G.border}`,padding:"14px 32px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(14,12,8,0.98)",flexShrink:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:30,height:30,background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>◈</div>
          <span style={{color:G.white,fontFamily:"Georgia,serif",fontSize:17}}>IQ Client</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <span style={{color:G.dim,fontSize:11,letterSpacing:1}}>👤 {user}</span>
          <span style={{color:G.dim,fontSize:11,letterSpacing:2}}>ITAÚ BBA — AI CHALLENGE 2026</span>
        </div>
      </div>

      {/* Body */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* Sidebar */}
        <div style={{width:185,borderRight:`1px solid ${G.border}`,padding:"24px 0",flexShrink:0,background:G.bg,overflowY:"auto"}}>
          {sections.map(s=>(
            <button key={s.id} onClick={()=>setActive(s.id)} style={{width:"100%",background:active===s.id?"rgba(200,169,110,0.08)":"transparent",border:"none",borderRight:active===s.id?`2px solid ${G.gold}`:"2px solid transparent",padding:"11px 20px",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",gap:10,transition:"all 0.2s"}}>
              <span style={{color:active===s.id?G.gold:G.dim,fontSize:13}}>{s.icon}</span>
              <span style={{color:active===s.id?G.white:G.dim,fontSize:12}}>{s.label}</span>
            </button>
          ))}
          <div style={{margin:"24px 20px 0",paddingTop:20,borderTop:`1px solid ${G.border}`}}>
            <p style={{color:G.dim,fontSize:10,letterSpacing:1,margin:"0 0 4px"}}>INSCRIÇÃO ATÉ</p>
            <p style={{color:G.gold,fontSize:13,fontWeight:700,margin:0}}>22 de Maio</p>
          </div>
        </div>

        {/* Conteúdo */}
        <div key={active} style={{flex:1,overflowY:"auto",padding:"40px 48px",background:G.bg,animation:"fadeIn 0.3s ease"}}>
          {renderSection()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

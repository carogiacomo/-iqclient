function riskColor(r){return r==="Baixo"?"#4ade80":r==="Médio"?"#fbbf24":"#f87171"}
function scoreColor(s){return s>=80?G.gold:s>=60?"#fbbf24":G.muted}
function initials(name){return name.split(" ").slice(0,2).map(w=>w[0]).join("")}
function parseCNPJ(c){const d=c.replace(/\D/g,"");return d.length===14?`${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`:c}

function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.style.display='none');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('section-'+id).style.display='block';
  document.querySelector(`[onclick="showSection('${id}')"]`).classList.add('active');
  renderSection(id);
}

function renderSection(id){
  const el=document.getElementById('section-'+id);
  if(el.dataset.rendered) return;
  el.dataset.rendered='1';
  if(id==='apresentacao') renderApresentacao(el);
  else if(id==='overview') renderOverview(el);
  else if(id==='problem') renderProblem(el);
  else if(id==='solution') renderSolution(el);
  else if(id==='prototype') renderPrototype(el);
  else if(id==='importacao') renderImportacao(el);
  else if(id==='team') renderTeam(el);
  else if(id==='impact') renderImpact(el);
}

function gerarBriefing(){
  const input=document.getElementById('cnpj-input');
  const error=document.getElementById('cnpj-error');
  const loading=document.getElementById('loading-box');
  const container=document.getElementById('dossie-container');
  error.style.display='none';
  container.innerHTML='';
  const fmt=parseCNPJ(input.value.trim());
  if(!demoData[fmt]){error.textContent='CNPJ não encontrado. Tente: 12.345.678/0001-99 ou 98.765.432/0001-11';error.style.display='block';return}
  loading.style.display='block';
  setTimeout(()=>{loading.style.display='none';container.innerHTML=renderDossie(demoData[fmt])},1800);
}

let importLista=[];
let importResultados=[];

function handleFileUpload(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{const lines=ev.target.result.split('\n').map(l=>l.split(/[,;]/)[0].trim()).filter(Boolean);document.getElementById('cnpj-area').value=lines.join('\n')};
  r.readAsText(f);
}

function validarLista(){
  const txt=document.getElementById('cnpj-area').value;
  importLista=txt.split(/[\n,;]/).map(c=>c.trim()).filter(Boolean).map(parseCNPJ);
  importResultados=[];
  document.getElementById('import-resultados').innerHTML='';
  const btn=document.getElementById('btn-processar');
  btn.style.display='block';
  btn.textContent=`🚀 GERAR ${importLista.length} BRIEFINGS`;
  document.getElementById('import-lista').innerHTML=`
  <div class="card" style="margin-bottom:20px">
    <p style="color:#C8A96E;font-size:11px;letter-spacing:2px;font-weight:700;margin:0 0 12px">✓ ${importLista.length} CNPJs VALIDADOS</p>
    ${importLista.map((c,i)=>`<div style="display:flex;gap:14px;align-items:center;background:rgba(0,0,0,0.3);border-radius:8px;padding:10px 16px;border:1px solid rgba(200,169,110,0.25);margin-bottom:8px"><span style="color:#7A6A4A;font-size:12px;min-width:28px">${i+1}.</span><span style="color:#F5ECD7;font-size:13px;font-family:monospace">${c}</span><span style="margin-left:auto;color:${demoData[c]?'#4ade80':'#A89878'};font-size:11px">${demoData[c]?'✓ Na base demo':'⊙ Processará via API'}</span></div>`).join('')}
  </div>`;
}

async function processarLista(){
  document.getElementById('import-lista').innerHTML='';
  document.getElementById('btn-processar').style.display='none';
  const prog=document.getElementById('import-progress');
  prog.style.display='block';
  importResultados=[];
  for(let i=0;i<importLista.length;i++){
    await new Promise(r=>setTimeout(r,1200));
    importResultados.push({cnpj:importLista[i],data:demoData[importLista[i]]||null});
    const pct=((i+1)/importLista.length*100);
    document.getElementById('progress-fill').style.width=pct+'%';
    document.getElementById('progress-text').textContent=`${i+1} de ${importLista.length} processados`;
  }
  prog.style.display='none';
  renderRanking();
}

  const sorted=[...importResultados].sort((a,b)=>(b.data?.scoreOportunidade?.total||0)-(a.data?.scoreOportunidade?.total||0));

  el.innerHTML=`<p style="color:#C8A96E;font-size:11px;letter-spacing:2px;font-weight:700;margin:0 0 16px">📊 RANKING POR SCORE</p>`;
  sorted.forEach((r,i)=>{
    const rc=r.data?riskColor(r.data.risco):'#A89878';

        ${r.data?`<div style="text-align:center"><p style="color:${scoreColor(r.data.scoreOportunidade.total)};font-size:22px;font-weight:900;margin:0">${r.data.scoreOportunidade.total}</p><p style="color:#7A6A4A;font-size:10px;margin:0">SCORE</p></div><span style="background:${rc}22;border:1px solid ${rc};color:${rc};padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700">${r.data.risco}</span><span style="background:${tc}22;border:1px solid ${tc};color:${tc};padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700">⏰ ${r.data.timingAcao.nivel}</span><span style="color:#C8A96E;font-size:13px">▼</span>`:''}

function toggleRanking(id,row){
  const el=document.getElementById(id);
  const isOpen=el.style.display==='block';
  el.style.display=isOpen?'none':'block';
  const arrow=row.querySelector('span:last-child');
  if(arrow)arrow.textContent=isOpen?'▼':'▲';
}

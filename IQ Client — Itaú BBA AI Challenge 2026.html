// ── LOGIN ──────────────────────────────────────────────────────────────────
function LoginScreen({onLogin}) {
  const [input,setInput]=useState("");
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);

  React.useEffect(()=>{
    if(ACESSO_LIVRE){ onLogin("Visitante","GUEST"); return; }
    const p=new URLSearchParams(window.location.search);
    const t=p.get("token");
    if(t&&TOKENS[t]) onLogin(TOKENS[t],t);
  },[]);

  const handle=()=>{
    setError(""); setLoading(true);
    setTimeout(()=>{
      if(ACESSO_LIVRE){ onLogin("Visitante","GUEST"); return; }
      const v=input.trim().toUpperCase();
      if(TOKENS[v]) onLogin(TOKENS[v],v);
      else if(input.trim()===SENHA_MESTRA) onLogin("Usuário Autorizado","MASTER");
      else{setError("Acesso negado. Verifique sua senha ou token.");setLoading(false);}
    },1000);
  };

  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:G.bg}}>
      <div style={{width:"100%",maxWidth:420,padding:48,background:"rgba(255,255,255,0.02)",border:`1px solid ${G.border}`,borderRadius:20,textAlign:"center"}}>
        <div style={{width:60,height:60,background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 24px"}}>◈</div>
        <h1 style={{fontFamily:"Georgia,serif",color:G.white,fontSize:28,fontWeight:400,margin:"0 0 8px"}}>IQ Client</h1>
        <p style={{color:G.muted,fontSize:13,margin:"0 0 36px",letterSpacing:1}}>ITAÚ BBA — AI CHALLENGE 2026</p>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}
          placeholder="Digite sua senha ou token de acesso" type="password"
          style={{width:"100%",background:"rgba(0,0,0,0.4)",border:`1px solid ${G.border}`,borderRadius:10,padding:"14px 18px",color:G.white,fontSize:14,outline:"none",marginBottom:12,textAlign:"center",letterSpacing:2}}/>
        {error&&<p style={{color:"#f87171",fontSize:12,margin:"0 0 12px"}}>🔒 {error}</p>}
        <button onClick={handle} disabled={loading}
          style={{width:"100%",background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,border:"none",borderRadius:10,padding:"14px",color:"#1A1208",fontWeight:700,fontSize:14,letterSpacing:1,opacity:loading?0.7:1}}>
          {loading?"VERIFICANDO...":"ACESSAR"}
        </button>
        <p style={{color:"#3A2E1A",fontSize:11,marginTop:24,lineHeight:1.6}}>Acesso restrito a membros autorizados.<br/>© IQ Client — CB Itaú BBA 2026</p>
      </div>
    </div>
  );
}

// ── WATERMARK ─────────────────────────────────────────────────────────────
function Watermark({user,token}) {
  const txt=`IQ CLIENT · CONFIDENCIAL · ${user.toUpperCase()} · ${token} · ITAÚ BBA 2026`;
  return (
    <div style={{position:"fixed",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:9999,overflow:"hidden"}}>
      {[...Array(8)].map((_,i)=>(
        <div key={i} style={{position:"absolute",top:`${i*14}%`,left:"-10%",width:"120%",whiteSpace:"nowrap",fontSize:11,fontWeight:600,letterSpacing:4,color:"rgba(200,169,110,0.055)",transform:"rotate(-25deg)",transformOrigin:"left center"}}>
          {txt} &nbsp;&nbsp;&nbsp; {txt} &nbsp;&nbsp;&nbsp; {txt}

    </div>
  );
}

// ── PROTOTYPE ──────────────────────────────────────────────────────────────
function PrototypeDemo() {
  const [cnpj,setCnpj]=useState("");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");

  const handle=()=>{
    setError(""); setResult(null);
    const d=cnpj.replace(/\D/g,"");
    const fmt=d.length===14?`${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`:cnpj;
    if(!demoData[fmt]){setError("CNPJ não encontrado. Tente: 12.345.678/0001-99 ou 98.765.432/0001-11");return;}
    setLoading(true);
    setTimeout(()=>{setResult(demoData[fmt]);setLoading(false);},1800);
  };

  return (
    <div>
      <div style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:24,marginBottom:20}}>
        <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:"0 0 14px"}}>◈ DEMO — INSIRA O CNPJ DO CLIENTE</p>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          <input value={cnpj} onChange={e=>setCnpj(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()} placeholder="Ex: 12.345.678/0001-99"
            style={{flex:1,minWidth:200,background:"rgba(0,0,0,0.4)",border:`1px solid ${G.border}`,borderRadius:8,padding:"12px 16px",color:G.white,fontSize:14,outline:"none"}}/>
          <button onClick={handle} style={{background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,border:"none",borderRadius:8,padding:"12px 28px",color:"#1A1208",fontWeight:700,fontSize:13,letterSpacing:1}}>GERAR BRIEFING</button>
        </div>
        {error&&<p style={{color:"#f87171",fontSize:12,marginTop:10}}>{error}</p>}
      </div>
      {loading&&(
        <div style={{textAlign:"center",padding:40,background:G.card,borderRadius:14,border:`1px solid ${G.border}`}}>
          <p style={{color:G.gold,fontSize:14,letterSpacing:2,fontWeight:700,margin:0,animation:"pulse 1s infinite"}}>⟳ IQ CLIENT PROCESSANDO...</p>
          <p style={{color:G.muted,fontSize:12,marginTop:8}}>Buscando dados em 12 fontes simultâneas</p>
        </div>
      )}
      {result&&<Briefing result={result}/>}
    </div>
  );
}

// ── IMPORTACAO ─────────────────────────────────────────────────────────────
function ImportacaoBase() {
  const [cnpjs,setCnpjs]=useState("");
  const [lista,setLista]=useState([]);
  const [processando,setProcessando]=useState(false);
  const [resultados,setResultados]=useState([]);
  const [expandido,setExpandido]=useState(null);

  const parse=t=>t.split(/[\n,;]/).map(c=>c.trim()).filter(Boolean).map(c=>{
    const d=c.replace(/\D/g,"");
    return d.length===14?`${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`:c;
  });

  const handleArquivo=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{const lines=ev.target.result.split("\n").map(l=>l.split(/[,;]/)[0].trim()).filter(Boolean);setCnpjs(lines.join("\n"));};
    r.readAsText(f);
  };

  const processar=async()=>{
    if(!lista.length) return;
    setProcessando(true); setResultados([]);
    const res=[];
    for(let i=0;i<lista.length;i++){
      await new Promise(r=>setTimeout(r,1200));
      res.push({cnpj:lista[i],data:demoData[lista[i]]||null});
      setResultados([...res]);
    }
    setProcessando(false);
  };

  return (
    <div>
      <span style={{color:G.gold,fontSize:11,letterSpacing:3}}>IMPORTAÇÃO DE BASE</span>
      <h2 style={{fontFamily:"Georgia,serif",color:G.white,fontSize:32,fontWeight:400,margin:"12px 0 8px"}}>Processar Lista de CNPJs</h2>
      <p style={{color:G.muted,fontSize:14,margin:"0 0 24px",lineHeight:1.7}}>Cole sua lista de CNPJs ou faça upload do CSV. O IQ Client gera o briefing de cada empresa automaticamente.</p>
      <div style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:24,marginBottom:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
          <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:0}}>📋 COLE OS CNPJs OU FAÇA UPLOAD</p>
          <label style={{background:"rgba(200,169,110,0.1)",border:`1px solid ${G.border}`,color:G.gold,padding:"8px 16px",borderRadius:8,fontSize:12,cursor:"pointer",fontWeight:600}}>
            ⬆ Upload CSV<input type="file" accept=".csv,.txt" onChange={handleArquivo} style={{display:"none"}}/>
          </label>
        </div>
        <textarea value={cnpjs} onChange={e=>setCnpjs(e.target.value)} rows={6}
          placeholder={"Cole aqui os CNPJs (um por linha):\n\n12.345.678/0001-99\n98.765.432/0001-11"}
          style={{width:"100%",background:"rgba(0,0,0,0.4)",border:`1px solid ${G.border}`,borderRadius:10,padding:"14px 16px",color:G.white,fontSize:13,outline:"none",resize:"vertical",fontFamily:"monospace",lineHeight:1.8}}/>
        <div style={{display:"flex",gap:12,marginTop:14}}>
          <button onClick={()=>{setLista(parse(cnpjs));setResultados([]);setExpandido(null);}} style={{background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,border:"none",borderRadius:8,padding:"12px 28px",color:"#1A1208",fontWeight:700,fontSize:13,letterSpacing:1}}>VALIDAR LISTA</button>
          {lista.length>0&&<button onClick={processar} disabled={processando} style={{background:processando?"rgba(200,169,110,0.2)":"rgba(200,169,110,0.1)",border:`1px solid ${G.border}`,borderRadius:8,padding:"12px 28px",color:processando?G.muted:G.gold,fontWeight:700,fontSize:13,letterSpacing:1,cursor:processando?"not-allowed":"pointer"}}>
            {processando?`⟳ PROCESSANDO... ${resultados.length}/${lista.length}`:`🚀 GERAR ${lista.length} BRIEFINGS`}
          </button>}
        </div>
      </div>
      {lista.length>0&&!resultados.length&&!processando&&(
        <div style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:24,marginBottom:20}}>
          <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:"0 0 12px"}}>✓ {lista.length} CNPJs VALIDADOS</p>
          {lista.map((c,i)=>(
            <div key={i} style={{display:"flex",gap:14,alignItems:"center",background:"rgba(0,0,0,0.3)",borderRadius:8,padding:"10px 16px",border:`1px solid ${G.border}`,marginBottom:8}}>
              <span style={{color:G.dim,fontSize:12,minWidth:28}}>{i+1}.</span>
              <span style={{color:G.white,fontSize:13,fontFamily:"monospace"}}>{c}</span>
              <span style={{marginLeft:"auto",color:demoData[c]?"#4ade80":G.muted,fontSize:11}}>{demoData[c]?"✓ Na base demo":"⊙ Processará via API"}</span>
            </div>
          ))}
        </div>
      )}
      {processando&&(
        <div style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:24,marginBottom:20}}>
          <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:"0 0 12px"}}>⟳ GERANDO BRIEFINGS...</p>
          <div style={{background:"rgba(200,169,110,0.1)",borderRadius:8,height:8,marginBottom:12}}>
            <div style={{width:`${(resultados.length/lista.length)*100}%`,height:8,background:`linear-gradient(90deg,${G.gold},${G.goldLight})`,borderRadius:8,transition:"width 0.5s"}}/>
          </div>
          <p style={{color:G.muted,fontSize:13,margin:0}}>{resultados.length} de {lista.length} processados</p>
        </div>
      )}
      {resultados.length>0&&(
        <div>
          <p style={{color:G.gold,fontSize:11,letterSpacing:2,fontWeight:700,margin:"0 0 16px"}}>📊 RANKING POR SCORE</p>
          <div style={{display:"grid",gap:12}}>
            {[...resultados].sort((a,b)=>(b.data?.scoreOportunidade?.total||0)-(a.data?.scoreOportunidade?.total||0)).map((r,i)=>(
              <div key={i}>
                <div onClick={()=>r.data&&setExpandido(expandido===r.cnpj?null:r.cnpj)} style={{background:G.card,border:`1px solid ${expandido===r.cnpj?G.gold:G.border}`,borderRadius:12,padding:"18px 22px",cursor:r.data?"pointer":"default",transition:"border 0.2s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
                    <div style={{width:36,height:36,borderRadius:"50%",background:i===0?`linear-gradient(135deg,${G.gold},${G.goldLight})`:"rgba(200,169,110,0.1)",display:"flex",alignItems:"center",justifyContent:"center",color:i===0?"#1A1208":G.gold,fontWeight:700,fontSize:14,flexShrink:0}}>{i+1}</div>
                    <div style={{flex:1}}>
                      <p style={{color:G.white,fontSize:15,fontWeight:700,margin:0}}>{r.data?r.data.empresa:r.cnpj}</p>
                      <p style={{color:G.muted,fontSize:12,margin:"3px 0 0"}}>{r.data?r.data.setor:"Não encontrado na base demo"}</p>
                    </div>
                    {r.data&&<>
                      <div style={{textAlign:"center"}}><p style={{color:scoreColor(r.data.scoreOportunidade.total),fontSize:22,fontWeight:900,margin:0}}>{r.data.scoreOportunidade.total}</p><p style={{color:G.dim,fontSize:10,margin:0}}>SCORE</p></div>
                      <span style={{background:riskColor(r.data.risco)+"22",border:`1px solid ${riskColor(r.data.risco)}`,color:riskColor(r.data.risco),padding:"4px 12px",borderRadius:20,fontSize:11,fontWeight:700}}>{r.data.risco}</span>
                      <span style={{background:r.data.timingAcao.cor+"22",border:`1px solid ${r.data.timingAcao.cor}`,color:r.data.timingAcao.cor,padding:"4px 12px",borderRadius:20,fontSize:11,fontWeight:700}}>⏰ {r.data.timingAcao.nivel}</span>
                      <span style={{color:G.gold,fontSize:13}}>{expandido===r.cnpj?"▲":"▼"}</span>
                    </>}
                  </div>
                </div>
                {expandido===r.cnpj&&r.data&&(
                  <div style={{background:"rgba(0,0,0,0.4)",border:`1px solid ${G.border}`,borderTop:"none",borderRadius:"0 0 12px 12px",padding:"20px 22px"}}>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12,marginBottom:14}}>
                      {[{l:"Faturamento",v:r.data.faturamento},{l:"Patrimônio",v:r.data.patrimonio},{l:"Espaço de Crédito",v:r.data.exposicaoMercado.espacoEstimado},{l:"Status BBA",v:r.data.status}].map((x,j)=>(
                        <div key={j} style={{background:G.card,borderRadius:8,padding:"10px 14px",border:`1px solid ${G.border}`}}>
                          <p style={{color:G.gold,fontSize:10,letterSpacing:1,margin:"0 0 4px"}}>{x.l.toUpperCase()}</p>
                          <p style={{color:G.white,fontSize:13,fontWeight:700,margin:0}}>{x.v}</p>
                        </div>
                      ))}
                    </div>
                    <div style={{background:G.card,borderRadius:8,padding:"12px 16px",marginBottom:10,border:`1px solid ${G.border}`}}>
                      <p style={{color:G.gold,fontSize:10,letterSpacing:1,fontWeight:700,margin:"0 0 6px"}}>🎯 ALERTA</p>
                      <p style={{color:G.white,fontSize:13,margin:0,lineHeight:1.6}}>{r.data.timingAcao.mensagem}</p>
                    </div>
                    <div style={{background:`linear-gradient(135deg,${G.gold},${G.goldLight})`,borderRadius:8,padding:"10px 16px"}}>
                      <p style={{color:"#1A1208",fontSize:13,fontWeight:700,margin:0}}>👉 {r.data.timingAcao.acaoSugerida}</p>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

      ],

        {nome:"Banco Central / SCR", desc:"Exposição no sistema financeiro"},

        {nome:"Base Interna BBA", desc:"CRM, Boletador 360, histórico"},
      ],
    },
    {
      tipo: "P2",

      ],

  ];

  const total = slides.length;
  const current = slides[slide];

  const next = () => setSlide(s => Math.min(s+1, total-1));

  React.useEffect(() => {
    const handler = (e) => {
      if(e.key === "ArrowRight" || e.key === " ") next();
      if(e.key === "ArrowLeft") prev();

                <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8}}>
                  {[
                    {icon:"🏦", nome:"Banco Central — SCR", desc:"Exposição no sistema financeiro"},
                    {icon:"📋", nome:"CVM", desc:"Títulos públicos, CRA, CRI, Debêntures"},

                    {icon:"📊", nome:"Serasa / Boa Vista", desc:"Score de crédito e restrições"},

                    <p style={{color:G.muted, fontSize:11, margin:0}}>{x.l}</p>

              </div>
            </div>
          </div>

          {/* Rodapé com time */}
          <div style={{background:G.card, border:`1px solid ${G.border}`, borderRadius:14, padding:20}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:12}}>
              <div>
                <p style={{color:G.gold, fontSize:10, letterSpacing:2, margin:"0 0 6px"}}>TIME</p>

                <p style={{color:G.gold, fontSize:10, letterSpacing:2, margin:"0 0 4px"}}>PROTÓTIPO AO VIVO</p>

      default: return null;

  };

  return (
    <div className="protected" style={{display:"flex",flexDirection:"column",height:"100vh",background:G.bg,color:G.white,overflow:"hidden"}}>

        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <span style={{color:G.dim,fontSize:11,letterSpacing:1}}>👤 {user}</span>

      </div>

      {/* Body */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>

        <div style={{width:185,borderRight:`1px solid ${G.border}`,padding:"24px 0",flexShrink:0,background:G.bg,overflowY:"auto"}}>
          {sections.map(s=>(
            <button key={s.id} onClick={()=>setActive(s.id)} style={{width:"100%",background:active===s.id?"rgba(200,169,110,0.08)":"transparent",border:"none",borderRight:active===s.id?`2px solid ${G.gold}`:"2px solid transparent",padding:"11px 20px",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",gap:10,transition:"all 0.2s"}}>
              <span style={{color:active===s.id?G.gold:G.dim,fontSize:13}}>{s.icon}</span>
              <span style={{color:active===s.id?G.white:G.dim,fontSize:12}}>{s.label}</span>
            </button>
          ))}
          <div style={{margin:"24px 20px 0",paddingTop:20,borderTop:`1px solid ${G.border}`}}>
            <p style={{color:G.dim,fontSize:10,letterSpacing:1,margin:"0 0 4px"}}>INSCRIÇÃO ATÉ</p>
            <p style={{color:G.gold,fontSize:13,fontWeight:700,margin:0}}>22 de Maio</p>
          </div>
        </div>

        {/* Conteúdo */}
        <div key={active} style={{flex:1,overflowY:"auto",padding:"40px 48px",background:G.bg,animation:"fadeIn 0.3s ease"}}>
          {renderSection()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
